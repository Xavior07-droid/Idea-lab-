{% extends "base.html" %}
{% block title %}Register — Digital Legacy Vault{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4">
        <h4 class="mb-1 fw-semibold">Create your vault</h4>
        <p class="text-muted small mb-4">Set up a secure account to begin organizing your legacy.</p>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input type="text" class="form-control" name="full_name" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" minlength="8" required>
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm password</label>
            <input type="password" class="form-control" name="confirm_password" minlength="8" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Create Account</button>
        </form>

        <p class="text-center small text-muted mt-3 mb-0">
          Already have an account? <a href="{{ url_for('auth.login') }}">Login here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
