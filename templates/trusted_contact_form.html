{% extends "base.html" %}
{% block title %}{{ "Edit" if contact else "Add" }} Trusted Contact - Digital Legacy Vault{% endblock %}
{% block content %}
<div class="form-card">
    <h2>{{ "Edit Trusted Contact" if contact else "Add Trusted Contact" }}</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" value="{{ contact.name if contact else '' }}" required>
        </div>
        <div class="form-group">
            <label for="relationship">Relationship</label>
            <input type="text" id="relationship" name="relationship" placeholder="e.g. Friend, Sibling, Lawyer" value="{{ contact.relationship_ if contact else '' }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ contact.email if contact else '' }}">
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" value="{{ contact.phone if contact else '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">{{ "Save Changes" if contact else "Add Trusted Contact" }}</button>
            <a href="{{ url_for('trusted_contacts_list') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
