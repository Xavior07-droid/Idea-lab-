{% extends "base.html" %}
{% block title %}Login — Digital Legacy Vault{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-0 mt-4">
      <div class="card-body p-4">
        <h4 class="mb-1 fw-semibold">Welcome back</h4>
        <p class="text-muted small mb-4">Log in to access your Digital Legacy Vault.</p>

        <form method="POST" action="{{ url_for('auth.login') }}">
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" name="email" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <p class="text-center small text-muted mt-3 mb-0">
          Don't have an account? <a href="{{ url_for('auth.register') }}">Register here</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
